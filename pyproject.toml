[project]
name = "so101-workcell"
version = "0.1.0"
description = "Language-driven SO-101 workcell: MuJoCo simulation, RL grasping, VLM planner, Cyberwave twin backend"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "mujoco>=3.3,<4",
    "numpy>=1.26",
    "gymnasium>=1.0",
    "stable-baselines3>=2.4",
    "torch>=2.6",
    "imageio[ffmpeg]>=2.34",
    "pillow>=10",
    "tqdm>=4.66",
    "pyyaml>=6",
    "huggingface_hub>=0.30",
    "cyberwave>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
vlm = ["openai>=1.40", "anthropic>=0.40"]
lerobot = ["lerobot>=0.3"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["so101_workcell*"]

[tool.setuptools.package-data]
"so101_workcell.sim" = ["assets/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
